[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-control-plane"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pg8000>=1.31,<2", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.setuptools]
package-dir = {"" = "services/control-plane/src"}

[tool.setuptools.packages.find]
where = ["services/control-plane/src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
