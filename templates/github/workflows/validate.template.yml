# TEMPLATE: the installer replaces action placeholders with reviewed full commit SHAs.
name: Validate Foundry project
on:
  pull_request:
permissions:
  contents: read
  checks: write
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@REVIEWED_FULL_SHA
      - name: Install locked toolchains
        run: ./scripts/bootstrap-ci.sh --locked
      - name: Validate
        run: ./scripts/validate-all.sh
