name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: foundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
        env:
          TEST_DATABASE_URL: postgresql://postgres:local_ci_password@127.0.0.1:5432/foundry_test
      - run: npm run typecheck
      - run: npm run validate -- project examples/project.yaml
      - run: npm run validate -- task examples/task.yaml
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_PASSWORD: local_ci_password
          POSTGRES_DB: foundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PYTHONPATH: services/control-plane/src
      TEST_DATABASE_URL: postgresql://postgres:local_ci_password@127.0.0.1:5432/foundry_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m ruff check services/control-plane/src scripts/export-openapi.py tests/python tests/python_integration
      - run: python -m ruff format --check services/control-plane/src scripts/export-openapi.py tests/python tests/python_integration
      - run: python -m mypy --strict services/control-plane/src scripts/export-openapi.py
      - run: python scripts/export-openapi.py --check
      - run: python -m pytest -q tests/python tests/python_integration --cov=foundry_control_plane --cov-report=term-missing --cov-fail-under=95
